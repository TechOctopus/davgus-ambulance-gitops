apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: davgus-ambulance-webapi
  namespace: wac-hospital-davgus
spec:
  imageRepositoryRef:
    name: davgus-ambulance-webapi # referuje ImageRepository z predchádzajúceho kroku
  filterTags:
    pattern: "main.*" # vyberie všetky verzie, ktoré začínajú na main- (napr. main-20240315.1200)
  policy:
    alphabetical:
      order: asc
